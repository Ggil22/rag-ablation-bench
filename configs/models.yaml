# LLMs behind OpenAI-compatible chat completion APIs. Keys go in .env.
providers:
  gemini:
    base_url: https://generativelanguage.googleapis.com/v1beta/openai/
    api_key_env: GEMINI_API_KEY        # https://aistudio.google.com/apikey
  groq:
    base_url: https://api.groq.com/openai/v1
    api_key_env: GROQ_API_KEY          # https://console.groq.com/keys
  openrouter:
    base_url: https://openrouter.ai/api/v1
    api_key_env: OPENROUTER_API_KEY
  cerebras:
    base_url: https://api.cerebras.ai/v1
    api_key_env: CEREBRAS_API_KEY
  local:                               # vLLM or Ollama on this machine
    base_url: http://localhost:8000/v1
    api_key_env: null

# rpm: requests per minute we send (stay below the free-tier limit).
# price_in / price_out: USD per million tokens at the provider's paid tier, used only to
# estimate cost per query. Left empty until checked against the provider's pricing page.
models:
  gemini-flash:
    provider: gemini
    model: gemini-3.5-flash
    rpm: 8
  gemini-flash-lite:
    provider: gemini
    model: gemini-3.5-flash-lite
    rpm: 12
  groq-gpt-oss-120b:
    provider: groq
    model: openai/gpt-oss-120b
    rpm: 25
  groq-gpt-oss-20b:
    provider: groq
    model: openai/gpt-oss-20b
    rpm: 25
  local-qwen:
    provider: local
    model: Qwen/Qwen3-4B-AWQ
