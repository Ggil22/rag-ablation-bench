  question: ¿Puedo deducir las aportaciones a mi plan de pensiones en la declaración conjunta y cómo se
    aplican los límites de reducción?
  answer: Sí, puedes deducir las aportaciones a tu plan de pensiones. En la declaración conjunta, cada
    cónyuge puede aplicar el límite máximo de reducción de forma individual, por lo que ambos pueden beneficiarse
    de la deducción por aportaciones a planes de pensiones.
  type: multi_evidence
  evidence:
  - ref: LIRPF#a84
    quote: Los límites máximos de reducción en la base imponible previstos en los artículos 52, 53 y 54
      y en la disposición adicional undécima de esta Ley, serán aplicados individualmente por cada partícipe
      o mutualista integrado en la unidad familiar.
  - ref: LIRPF#a51
    quote: 'Podrán reducirse en la base imponible general las siguientes aportaciones y contribuciones
      a sistemas de previsión social:

      1. Aportaciones y contribuciones a planes de pensiones.

      1.º Las aportaciones realizadas por los partícipes a planes de pensiones, incluyendo las contribuciones
      del promotor que le hubiesen sido imputadas en concepto de rendimiento del trabajo'
