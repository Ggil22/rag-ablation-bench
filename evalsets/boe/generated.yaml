- id: gen-122
  question: Mi esposa y yo estamos pensando en presentar la declaración de la renta juntos. ¿Cómo afecta
    eso a la retención que se aplica a los ingresos de mi esposa?
  answer: Al presentar la declaración en conjunto, ambos contribuyentes se consideran una sola unidad
    familiar y se aplican las retenciones correspondientes a cada uno según la escala de 2015. La retención
    se calcula sobre los ingresos del trabajo de cada persona antes del 12 de julio con la tabla que indica
    los tipos de 20%, 25%, 31%, 39% y 47% según el tramo. Si la retención se aplica después del 12 de
    julio, se usa la escala con tipos ligeramente menores (19,5%, 24,5%, 30,5%, 38% y 46%). Al tributar
    conjuntamente, el resultado final de la declaración se determina con la suma de ambos ingresos y las
    retenciones aplicadas, y se calcula el impuesto sobre la renta de la unidad familiar.
  type: multi_evidence
  evidence:
  - ref: LIRPF#datrigesimaprimera
    quote: 'En el período impositivo 2015, para determinar el tipo de retención o ingreso a cuenta a practicar
      sobre los rendimientos del trabajo satisfechos con anterioridad a 12 de julio a los que resulte
      de aplicación el procedimiento general de retención a que se refiere el artículo 82 del Reglamento
      del Impuesto sobre la Renta de las Personas Físicas, la escala de retención a que se refiere el
      apartado 1 del artículo 101 de esta Ley será la siguiente:'
  - ref: LIRPF#a82
    quote: 'Podrán tributar conjuntamente las personas que formen parte de alguna de las siguientes modalidades
      de unidad familiar:

      1.ª La integrada por los cónyuges no separados legalmente y, si los hubiera:

      a) Los hijos menores, con excepción de los que, con el consentimiento de los padres, vivan independientes
      de éstos.

      b) Los hijos mayores de edad incapacitados judicialmente sujetos a patria potestad prorrogada o
      rehabilitada'
  lexical_overlap: 0.364
  source: groq-gpt-oss-20b
