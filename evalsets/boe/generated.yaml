- id: gen-121
  question: Compré acciones de una empresa de nueva creación y deduje el 50 % de la inversión. Ahora las
    he vendido y quiero reinvertir el dinero en la misma empresa. ¿Puedo excluir la ganancia de la base
    imponible?
  answer: Sí, puedes excluir la ganancia patrimonial siempre que cumplas con las condiciones de ambos
    apartados. El artículo 38 permite excluir de gravamen las ganancias obtenidas por la transmisión de
    acciones que se hubieran adquirido con la deducción prevista en el artículo 68, siempre que el importe
    total obtenido se reinvierta en la adquisición de acciones o participaciones de la misma entidad.
    Por su parte, el artículo 68 establece que los contribuyentes pueden deducirse el 50 % de las cantidades
    satisfechas por la suscripción de acciones o participaciones en empresas de nueva o reciente creación,
    siempre que se cumplan los requisitos de la normativa. Por lo tanto, si reinviertes el importe total
    de la venta en la misma empresa y cumples con los requisitos de la deducción de la Ley de la Renta,
    la ganancia quedará exenta de gravamen.
  type: multi_evidence
  evidence:
  - ref: LIRPF#a38
    quote: Podrán excluirse de gravamen las ganancias patrimoniales que se pongan de manifiesto con ocasión
      de la transmisión de acciones o participaciones por las que se hubiera practicado la deducción prevista
      en el artículo 68.1 de esta Ley, siempre que el importe total obtenido por la transmisión de las
      mismas se reinvierta en la adquisición de acciones o participaciones de las citadas entidades en
      las condiciones que reglamentariamente se determinen.
  - ref: LIRPF#a68
    quote: Los contribuyentes podrán deducirse el 50 por ciento de las cantidades satisfechas en el período
      de que se trate por la suscripción de acciones o participaciones en empresas de nueva o reciente
      creación, cuando se cumpla lo dispuesto en los números 2.º y 3.º de este apartado, pudiendo, además
      de la aportación temporal al capital, aportar sus conocimientos empresariales o profesionales adecuados
      para el desarrollo de la entidad en la que invierten, en los términos que establezca el acuerdo
      de inversión entre el contribuyente y la entidad.
  lexical_overlap: 0.45
  source: groq-gpt-oss-20b
