- id: gen-118
  question: ¿Qué puede hacer la Agencia Española de Protección de Datos si una empresa usa un organismo
    de certificación que no está acreditado para transferir datos al extranjero?
  answer: La Agencia puede sancionar al organismo de certificación por incumplir la normativa y, al mismo
    tiempo, adoptar cláusulas contractuales tipo y normas corporativas vinculantes para garantizar que
    las transferencias internacionales de datos se realicen con los niveles adecuados de protección.
  type: multi_evidence
  evidence:
  - ref: LOPDGDD#a7-5
    quote: z) El desempeño de funciones que el Reglamento (UE) 2016/679 reserva a los organismos de certificación,
      sin haber sido debidamente acreditado conforme a lo establecido en el artículo 39 de esta ley orgánica.
  - ref: LOPDGDD#a4-3
    quote: 1. La Agencia Española de Protección de Datos y las autoridades autonómicas de protección de
      datos podrán adoptar, conforme a lo dispuesto en el artículo 46.2.c) del Reglamento (UE) 2016/679,
      cláusulas contractuales tipo para la realización de transferencias internacionales de datos, que
      se someterán previamente al dictamen del Comité Europeo de Protección de Datos previsto en el artículo
      64 del citado reglamento.
