- id: gen-115
  question: Si presento una queja sobre el tratamiento de mis datos y el Comité Europeo de Protección
    de Datos necesita revisar mi caso, ¿cómo se coordinará la comunicación y cuánto tiempo tardará el
    proceso?
  answer: La Agencia Española de Protección de Datos se encargará de todas las comunicaciones entre el
    Comité Europeo de Protección de Datos y las autoridades autonómicas, con la ayuda de un representante
    de la autoridad autonómica. El procedimiento que se inicie tendrá una duración máxima de doce meses
    desde la fecha del acuerdo de inicio.
  type: multi_evidence
  evidence:
  - ref: LOPDGDD#a6-2
    quote: Se practicarán por conducto de la Agencia Española de Protección de Datos todas las comunicaciones
      entre el Comité Europeo de Protección de Datos y las autoridades autonómicas de protección de datos
      cuando éstas, como autoridades competentes, deban someter su proyecto de decisión al citado comité
      o le soliciten el examen de un asunto en virtud de lo establecido en los apartados 1 y 2 del artículo
      64 del Reglamento (UE) 2016/679.
  - ref: LOPDGDD#a6-6
    quote: El procedimiento tendrá una duración máxima de doce meses a contar desde la fecha del acuerdo
      de inicio.
  lexical_overlap: 0.312
