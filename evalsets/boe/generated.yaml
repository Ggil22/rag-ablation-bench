- id: gen-117
  question: Compré una silla a medida a través de una tienda online. ¿Puedo cancelarla y qué costos tendría
    que asumir si lo hiciera?
  answer: No, no puedes cancelarla. El hecho de que la silla haya sido confeccionada según tus especificaciones
    la coloca dentro de una excepción al derecho de desistimiento, por lo que ese derecho no se aplica
    y estás obligado a pagar el precio total. Si, en cambio, el contrato hubiera sido susceptible de desistimiento,
    tendrías que pagar el coste de devolución de los bienes, pero en este caso no existe tal derecho.
  type: multi_evidence
  evidence:
  - ref: TRLGDCU#a97
    quote: 'j) Cuando exista un derecho de desistimiento, las condiciones, el plazo y los procedimientos
      para ejercer ese derecho, así como el modelo de formulario de desistimiento.

      k) Cuando proceda, la indicación de que el consumidor o usuario tendrá que asumir el coste de la
      devolución de los bienes en caso de desistimiento y, para los contratos a distancia, cuando los
      bienes, por su naturaleza, no puedan devolverse normalmente por correo postal, el coste de la devolución
      de los mismos'
  - ref: TRLGDCU#a103
    quote: 'b) El suministro de bienes o la prestación de servicios cuyo precio dependa de fluctuaciones
      del mercado financiero que el empresario no pueda controlar y que puedan producirse durante el periodo
      de desistimiento.

      c) El suministro de bienes confeccionados conforme a las especificaciones del consumidor y usuario
      o claramente personalizados'
  lexical_overlap: 0.333
