- id: gen-116
  question: Si quiero hacer mejoras en mi piso alquilado y el arrendador se opone, ¿cuánto tiempo tendría
    para resolver la disputa mediante arbitraje?
  answer: Las mejoras están reguladas por las disposiciones de los artículos 21, 22, 23 y 26, y el artículo
    19, que se aplican a los arrendamientos desde el inicio. Si surge una disputa y no hay acuerdo expreso,
    el arbitraje debe dictar laudo en un plazo de tres meses.
  type: multi_evidence
  evidence:
  - ref: LAU#daseptima
    quote: En los procedimientos arbitrales que traigan causa de contratos sometidos al régimen jurídico
      de la Ley de Arrendamientos Urbanos, a falta de pacto expreso de las partes, los árbitros deberán
      dictar el laudo en el término de tres meses, contado como se dispone en el número 1 de este artículo.
  - ref: LAU#a30
    quote: Lo dispuesto en los artículos 21, 22, 23 y 26 de esta ley será también aplicable a los arrendamientos
      que regula el presente Título. También lo será lo dispuesto en el artículo 19 desde el comienzo
      del arrendamiento.
  lexical_overlap: 0.071
