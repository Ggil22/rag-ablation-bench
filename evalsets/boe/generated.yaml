    del impuesto sobre sociedades a la deducción de los intereses que pago por la compra de la vivienda
    que alquilo?
  answer: No. La derogación de los artículos del impuesto sobre sociedades no modifica la normativa del
    impuesto sobre la renta de las personas físicas. En la IRPF, los intereses de los préstamos que se
    usan para adquirir o mejorar la vivienda que alquilas siguen siendo deducibles, siempre y cuando el
    importe total no supere el rendimiento íntegro que genere esa vivienda. Por tanto, puedes seguir deduciendo
    esos intereses dentro del límite establecido, sin que la eliminación de las normas del impuesto sobre
    sociedades tenga efecto sobre esa deducción.
  type: multi_evidence
  evidence:
  - ref: LIRPF#ddsegunda
    quote: Con efectos para los períodos impositivos que se inicien a partir de 1 de enero de 2007 quedan
      derogados el artículo 23 y el Capítulo VI del Título VII del texto refundido de la Ley del Impuesto
      sobre Sociedades, aprobado por Real Decreto Legislativo 4/2004, de 5 de marzo.
  - ref: LIRPF#a23
    quote: Los intereses de los capitales ajenos invertidos en la adquisición o mejora del bien, derecho
      o facultad de uso y disfrute del que procedan los rendimientos, y demás gastos de financiación,
      así como los gastos de reparación y conservación del inmueble.
  lexical_overlap: 0.231
